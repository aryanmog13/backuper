name: Windows executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Backuper version
        required: true
        type: string
      attach_to_draft:
        description: Attach the tested executable to the matching draft release
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
          architecture: x64
      - name: Install the packaging tool
        run: python -m pip install PyInstaller==6.22.3
      - name: Build and test the standalone executable
        env:
          BACKUPER_VERSION: ${{ inputs.version }}
        run: |
          if ($env:BACKUPER_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a major.minor.patch version.' }
          .\windows\build-exe.ps1 -Version $env:BACKUPER_VERSION -OutputDirectory dist
      - name: Upload the verified executable
        uses: actions/upload-artifact@v7
        with:
          name: backuper-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0

  attach:
    if: inputs.attach_to_draft
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backuper-windows-x64
          path: dist
      - name: Attach executable to the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release="v$VERSION"
          draft=$(gh release view "$release" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)
          jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' <<< "$draft"
          gh release upload "$release" "dist/Backuper-$VERSION-Windows-x64.exe" --repo "$GITHUB_REPOSITORY"
